# Manual Firebase Hosting preview channel deploy
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting (preview)
on:
  workflow_dispatch:
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        working-directory: site
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOBSIMP_WIDGET }}
          projectId: jobsimp-widget
          entryPoint: site
