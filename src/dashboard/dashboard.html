<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JobSimp Dashboard</title>
<style>
:root{--bg:#0f1420;--card:#1a2130;--border:#2a3348;--text:#e8ecf4;--muted:#8b95ab;--accent:#4f8ef7;--green:#34c07a;--red:#e5604c;--yellow:#e8b13f;--purple:#9b7ef7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:24px;font-size:14px}
h1{font-size:20px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{padding:8px 18px;border-radius:8px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:13px}
.tab.active{background:var(--accent);border-color:var(--accent);font-weight:600}
.panel{display:none}.panel.active{display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
.stat .n{font-size:22px;font-weight:700}.stat .l{color:var(--muted);font-size:11px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
th{text-align:left;padding:9px 10px;background:#141a28;color:var(--muted);font-size:11px;text-transform:uppercase;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--border);vertical-align:top}
tr:hover td{background:#1e2636}
input,select,textarea,button{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.small{padding:3px 8px;font-size:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;background:#3a3f52}
.yes{color:var(--green);font-weight:600}.no{color:var(--red)}.unk{color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;width:min(720px,94vw);max-height:92vh;overflow-y:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.field label{font-size:11px;color:var(--muted);text-transform:uppercase}
.field input,.field select,.field textarea{width:100%}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.score{font-weight:700}
#composer .field textarea{min-height:180px}
.hint{font-size:12px;color:var(--muted);margin:10px 0}
.sendres{font-size:12px;margin-top:8px;white-space:pre-wrap}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>JobSimp Dashboard</h1>
<div class="tabs">
  <div class="tab active" data-tab="tracker">📋 Tracker</div>
  <div class="tab" data-tab="feed">🔔 New Jobs</div>
  <div class="tab" data-tab="outreach">✉️ Outreach</div>
</div>

<div class="panel active" id="tracker">
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <button class="primary" id="addJob">+ Add Job</button>
    <input type="search" id="q" placeholder="Search…">
    <select id="fStatus"><option value="">All statuses</option></select>
  </div>
  <table>
    <thead><tr><th>Date</th><th>Company</th><th>Role</th><th>Status</th><th>Sponsor</th><th>E-Verify</th><th>Follow-up</th><th>Referral</th><th>Actions</th></tr></thead>
    <tbody id="jobRows"></tbody>
  </table>
</div>

<div class="panel" id="feed">
  <div class="toolbar">
    <button class="primary" id="pollNow">🔄 Check now</button>
    <span class="hint">Sources: Greenhouse/Lever targets + SimplifyJobs new-grad feed (configure in Settings)</span>
  </div>
  <table>
    <thead><tr><th>Score</th><th>Company</th><th>Title</th><th>Location</th><th>Posted</th><th>Actions</th></tr></thead>
    <tbody id="feedRows"></tbody>
  </table>
</div>

<div class="panel" id="outreach">
  <div id="composer">
    <div class="grid2">
      <div class="field"><label>Job (JD used for drafting)</label><select id="c_job"></select></div>
      <div class="field"><label>Recipient email(s) — comma/newline separated</label><textarea id="c_to" rows="1" placeholder="hm@company.com, recruiter@company.com"></textarea></div>
    </div>
    <div class="field"><label>Or paste JD text directly</label><textarea id="c_jd" rows="3" placeholder="Paste job description if not tracked…"></textarea></div>
    <div class="toolbar">
      <button class="primary" id="draftBtn">✨ Draft with AI</button>
      <span class="hint" id="draftStatus"></span>
    </div>
    <div class="field"><label>Subject</label><input id="c_subject"></div>
    <div class="field"><label>Body</label><textarea id="c_body"></textarea></div>
    <div class="actions"><button class="primary" id="sendBtn">📤 Send via Gmail</button></div>
    <div class="sendres" id="sendres"></div>
  </div>
  <h3 style="margin:18px 0 10px;font-size:14px">Sent log</h3>
  <table>
    <thead><tr><th>Date</th><th>To</th><th>Subject</th><th>Job</th><th>Status</th></tr></thead>
    <tbody id="emailRows"></tbody>
  </table>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="modalTitle" style="font-size:16px;margin-bottom:14px">Add Job</h2>
    <div class="grid2">
      <div class="field"><label>Company *</label><input id="m_company"></div>
      <div class="field"><label>Role *</label><input id="m_role"></div>
      <div class="field"><label>Date</label><input type="date" id="m_date"></div>
      <div class="field"><label>Status</label><select id="m_status"></select></div>
      <div class="field"><label>Sponsorship</label><select id="m_sponsorship"><option>Unknown</option><option>Yes</option><option>No</option></select></div>
      <div class="field"><label>E-Verify</label><select id="m_everify"><option>Unknown</option><option>Yes</option><option>No</option></select></div>
      <div class="field"><label>Follow-up date</label><input type="date" id="m_followup"></div>
      <div class="field"><label>Referral</label><select id="m_referral"><option>No</option><option>Yes</option></select></div>
      <div class="field"><label>Location</label><input id="m_location"></div>
      <div class="field"><label>Salary</label><input id="m_salary"></div>
    </div>
    <div class="field"><label>URL</label><input id="m_url"></div>
    <div class="field"><label>JD text (powers AI drafting)</label><textarea id="m_jd" rows="4"></textarea></div>
    <div class="field"><label>Notes</label><textarea id="m_notes" rows="2"></textarea></div>
    <div class="actions">
      <button id="cancelBtn">Cancel</button>
      <button class="primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
