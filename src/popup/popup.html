<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
:root{--bg:#0f1420;--card:#1a2130;--border:#2a3348;--text:#e8ecf4;--muted:#8b95ab;--accent:#4f8ef7;--green:#34c07a;--yellow:#e8b13f}
*{box-sizing:border-box;margin:0;padding:0}
body{width:340px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding:16px;font-size:13px}
h1{font-size:15px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.stat .n{font-size:20px;font-weight:700}
.stat .l{color:var(--muted);font-size:10px;margin-top:2px}
button{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-size:13px;cursor:pointer;margin-bottom:8px;text-align:left}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);font-weight:600;text-align:center}
#msg{font-size:12px;color:var(--yellow);min-height:16px;margin-top:4px;white-space:pre-wrap}
.due{color:var(--yellow);font-size:12px;margin-bottom:8px}
</style>
</head>
<body>
<h1>JobSimp</h1>
<div class="stats" id="stats"></div>
<div class="due" id="due"></div>
<button class="primary" id="openDash">📋 Open Dashboard</button>
<button id="autofill">⚡ Autofill this page</button>
<button id="trackPage">➕ Track job on this page</button>
<button id="pollNow">🔄 Check for new jobs now</button>
<button id="openOptions">⚙️ Settings (keys, resume, Q&A)</button>
<div id="msg"></div>
<script src="popup.js"></script>
</body>
</html>
