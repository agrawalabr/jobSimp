<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
/* width set by widget.js: 300px when vw ≥ 1200, else 250px */
.panel{position:fixed;top:0;right:0;height:100vh;width:250px;max-width:94vw;background:#141a28;color:#e8ecf4;
  border-left:1px solid #2a3348;box-shadow:-8px 0 32px rgba(0,0,0,.5);transform:translateX(100%);
  transition:transform .2s ease,width .2s ease;display:flex;flex-direction:column;pointer-events:auto;font-size:13px;z-index:2}
.panel.open{transform:none}
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#0f1420;border-bottom:1px solid #2a3348;flex:0 0 auto}
.hd img{width:30px;height:30px;border-radius:50%;display:none}
.hd .brand{font-weight:800;font-size:15px}
.hd .dot{color:#34c07a;font-size:10px}
.hd .who{font-size:11px;color:#8b95ab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:auto;margin-left:auto;background:none;border:none;color:#8b95ab;font-size:20px;cursor:pointer;line-height:1;padding:2px 6px}
.x:hover{color:#fff}
.bd{padding:14px 16px;overflow-y:auto;flex:1 1 auto}
.sect{margin-bottom:16px}
.role-row{display:flex;align-items:flex-start;flex-wrap:wrap;gap:6px 8px;margin:2px 0 2px}
.role{font-size:15px;font-weight:700;line-height:1.3;min-width:0;flex:1 1 auto}
.role a{color:#e8ecf4;text-decoration:none;display:inline;border-bottom:1px solid transparent}
.role a:hover{color:#4f8ef7;border-bottom-color:#4f8ef7}
.role .ext{display:inline-block;width:12px;height:12px;margin-left:5px;vertical-align:-1px;opacity:.75;flex-shrink:0}
.role a:hover .ext{opacity:1;color:#4f8ef7}
.badge-sponsor{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.2px;padding:2px 8px;border-radius:6px;
  line-height:1.4;margin-top:2px;border:1px solid transparent}
.badge-sponsor.ok{background:#14261c;color:#6fe89a;border-color:#1f4a2c}
.badge-sponsor.bad{background:#2a1418;color:#f08585;border-color:#4a1f24}
.badge-sponsor.maybe{background:#2a2210;color:#e8b13f;border-color:#4a3a1f}
.company{color:#a9b4cc;margin-top:2px;font-size:12px}
.company a{color:#a9b4cc;text-decoration:none;border-bottom:1px solid transparent}
.company a:hover{color:#4f8ef7;border-bottom-color:#4f8ef7}
.meta{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}
.mrow{display:inline-flex;align-items:baseline;gap:5px;background:#0f1420;border:1px solid #23304a;border-radius:6px;
  padding:3px 7px;flex:0 1 auto;max-width:100%;line-height:1.25}
.mrow.wide{flex:1 1 100%;display:flex}
.mk{font-size:8px;text-transform:uppercase;letter-spacing:.4px;color:#8b95ab;white-space:nowrap}
.mk:after{content:':'}
.mv{font-size:11px;word-break:break-word;font-weight:600}
ul.people{list-style:none;margin:0;padding:0}
ul.people li{padding:1px 0;font-size:12px;font-weight:600;line-height:1.3;color:#e8ecf4}
ul.people a{color:inherit;text-decoration:none}
ul.people a:hover{color:#4f8ef7}
ul.people .ptitle{display:block;font-size:10px;font-weight:400;color:#8b95ab;line-height:1.25;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl{font-size:10px;color:#8b95ab;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 4px}
select,button{width:100%;height:30px;background:#0f1420;border:1px solid #2a3348;color:#e8ecf4;border-radius:8px;padding:6px 12px;font-size:10px;cursor:pointer}
button{margin-top:8px}
button.primary{background:#4f8ef7;border-color:#4f8ef7;font-weight:600}
button:disabled{opacity:.55;cursor:default}
.resume-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.resume-row select{flex:1;min-width:0;margin:0}
.icon-btn{flex:0 0 auto;width:30px;height:30px;margin:0;padding:0;display:inline-flex;align-items:center;justify-content:center;
  border-radius:8px;background:#0f1420;border:1px solid #2a3348;color:#a9b4cc}
.icon-btn:hover{border-color:#4f8ef7;color:#e8ecf4}
.icon-btn svg{width:16px;height:16px;display:block}
.apply-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.apply-row button{margin:0;padding:6px 8px;font-size:11px;font-weight:600}
.apply-row button.primary{background:#4f8ef7;border-color:#4f8ef7}
.scoreRow{display:flex;justify-content:space-between;align-items:baseline}
.scoreRow b{font-size:24px}
.scorebar{height:8px;border-radius:4px;background:#2a3348;margin:6px 0 4px;overflow:hidden}
.scorebar>div{height:100%;border-radius:4px;width:0;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-height:110px;overflow:auto}
.chip{font-size:10px;padding:2px 8px;border-radius:10px;background:#1f4a2c;color:#6fe89a}
.chip.miss{background:#4a1f24;color:#f08585}
ul.clean{list-style:none;margin:4px 0 0;padding:0}
ul.clean li{position:relative;padding:4px 6px 4px 16px;font-size:12px;line-height:1.4;border-bottom:1px solid #1c2434}
ul.clean li:before{content:'›';position:absolute;left:2px;color:#4f8ef7}
ul.clean li.gap:before{content:'!';color:#e8b13f}
ul.clean li.add:before{content:'+';color:#34c07a}
ul.clean li.muted{color:#8b95ab;border:none}
.an_summary{background:#0f1420;border:1px solid #23304a;border-radius:8px;padding:10px;font-size:12px;line-height:1.5}
.status{font-size:12px;line-height:1;min-height:0;white-space:pre-wrap;margin-top:6px;padding:0;border-radius:8px;}
.status:empty{display:none;margin:0;padding:0;border:none}
.status.info{color:#8b95ab;background:#121826;border-color:#23304a;padding:6px 10px}
.status.ok{color:#6fe89a;background:#14261c;border-color:#1f4a2c;padding:6px 10px}
.status.warn{color:#e8b13f;background:#2a2210;border-color:#4a3a1f;padding:6px 10px}
.status.err{color:#f08585;background:#2a1418;border-color:#4a1f24;padding:6px 10px}
.status.busy{color:#7db4f0;background:#141c2c;border-color:#1e3a5f;padding:6px 10px}
.muted{color:#8b95ab}
.skel{background:linear-gradient(90deg,#1a2233 25%,#243049 37%,#1a2233 63%);background-size:400% 100%;
  animation:sk 1.2s ease infinite;border-radius:6px;height:12px;margin:8px 0}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
/* ---- application mode (phase 2): consolidated Q&A + single mirrored nav button ---- */
ul.qa{list-style:none;margin:6px 0 0;padding:0;max-height:45vh;overflow-y:auto}
ul.qa li{padding:5px 6px;border-bottom:1px solid #1c2434;font-size:11px;line-height:1.35}
ul.qa .q{color:#8b95ab;display:block}
ul.qa .a{color:#e8ecf4;font-weight:600;word-break:break-word;white-space:pre-wrap}
ul.qa li.todo .a{color:#e8b13f;font-weight:400;font-style:italic}
.src{font-size:8px;text-transform:uppercase;letter-spacing:.4px;border-radius:4px;padding:1px 4px;margin-left:5px;vertical-align:1px}
.src.profile{background:#14261c;color:#6fe89a}
.src.qa{background:#141c2c;color:#7db4f0}
.src.llm{background:#221a33;color:#b48cf0}
.src.prior{background:#2a2210;color:#e8b13f}
.src.file{background:#1f2a3a;color:#9db9dd}
#navBtn{display:none;font-weight:700}
</style>
<div class="panel" id="panel">
  <div class="hd">
    <img id="pic" alt="">
    <div style="min-width:0">
      <div class="brand">JobSimp <span class="dot">● active</span></div>
      <div class="who" id="who">Not signed in</div>
    </div>
    <button class="x" id="closeBtn" title="Close" type="button">✕</button>
  </div>
  <div class="bd">
    <div id="authGate" style="display:none">
      <button class="primary" id="setupBtn" type="button">Sign in / finish setup</button>
      <div class="muted" style="font-size:12px;margin-top:6px">Registration required to use JobSimp.</div>
    </div>
    <div id="main" style="display:none">
      <div class="sect" id="jobCard" style="display:none">
        <div class="role" id="jd_role">—</div>
        <div class="company" id="jd_company"></div>
        <div class="meta" id="jd_meta"></div>
        <div class="role-row">
          <span class="badge-sponsor" id="jd_sponsor" style="display:none"></span>
        </div>
      </div>

      <div class="sect" id="peopleBox" style="display:none">
        <div class="lbl">Reach out</div>
        <ul class="people" id="people"></ul>
      </div>

      <div id="noJd" class="muted" style="margin:4px 0">Scanning this page…</div>

      <div class="lbl">Resume</div>
      <div class="resume-row">
        <select id="resumeSel"></select>
        <button class="icon-btn" id="analyzeBtn" type="button" title="Re-analyze with AI" aria-label="Re-analyze" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.6-6.3"/>
            <polyline points="21 3 21 9 15 9"/>
          </svg>
        </button>
        <button class="icon-btn" id="trackBtn" type="button" title="Save job" aria-label="Save">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
        </button>
      </div>
      <div class="apply-row" id="applyRow">
        <button id="autofillBtn" type="button">Apply</button>
        <button class="primary" id="tailoredApplyBtn" type="button">✨ Tailor & Apply</button>
      </div>
      <button class="primary" id="navBtn" type="button">Continue</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div id="skeleton" style="display:none">
        <div class="skel" style="width:80%"></div><div class="skel" style="width:95%"></div><div class="skel" style="width:70%"></div>
      </div>

      <div id="applyBox" style="display:none">
        <div class="lbl">Application questions</div>
        <ul class="qa" id="qaList"></ul>
      </div>

      <div id="matchBox" style="display:none">
        <div class="lbl">Resume ↔ JD match</div>
        <div class="scoreRow"><b id="scoreTxt">0%</b><span class="muted" id="matchCounts"></span></div>
        <div class="scorebar"><div id="scoreFill"></div></div>
        <div class="lbl">Strong matches · </div><div class="chips" id="matchedChips"></div>
        <div class="lbl">Required · </div><div class="chips" id="missingChips"></div>
      </div>

      <div id="analysisBox" style="display:none">
        <div class="lbl">Summary</div>
        <div class="an_summary" id="an_summary"></div>
        <div class="lbl">Must have (before applying)</div><ul class="clean" id="an_must"></ul>
        <div class="lbl">Good to have</div><ul class="clean" id="an_good"></ul>
      </div>

    </div>
  </div>
</div>
