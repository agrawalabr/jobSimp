<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.badge{position:fixed;right:14px;top:calc(50vh - 26px);width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#4f8ef7,#9b7ef7);color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:grab;box-shadow:0 4px 16px rgba(0,0,0,.4);font-weight:800;font-size:17px;user-select:none;touch-action:none;
  pointer-events:auto;transition:transform .12s;z-index:1}
.badge:hover{transform:scale(1.07)}
.badge:active{cursor:grabbing}
.badge .score{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;padding:0 5px;
  display:none;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;border:2px solid #0f1420}
</style>
<div class="badge" id="badge">JS<span class="score" id="score"></span></div>
