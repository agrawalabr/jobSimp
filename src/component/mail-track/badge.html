<style id="jobsimp-track-styles-src">

    color: #c89f02 !important;
    background: #fef7e0 !important;

  .jobsimp-pill.opened {

    padding: 0 4px;

  }

  .bHJ .jobsimp-track-open {
    display: inline-flex !important;
    align-items: center !important;
    margin-right: 8px !important;
    flex: 0 0 auto !important;
    align-self: center !important;
  }

  .jobsimp-track-open {
    flex: 0 0 auto !important;
    align-self: center !important;
  }

  .jobsimp-track-open .jobsimp-pill {
    margin: 0 !important;
    align-self: center !important;
  }

  .jobsimp-compose-track {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    width: 27px !important;
    height: 27px !important;
    min-width: 27px !important;
    margin: 0 0 0 6px !important;
    padding: 0 !important;

  }

  div.a5C{
    padding: 8px 15px !important;
  }
  
  div.H2{
    align-self: flex-start !important;
  }

  /* No solid fill — blends in Gmail light and dark. */
  .jobsimp-track-summary {

    align-items: center !important;
    gap: 10px !important;
    height: 32px !important;
    margin: 0 0 0 auto !important;

    z-index: 1 !important;

    height: 6px !important;
    border-radius: 50% !important;
    background: #8ab4f8 !important;
    box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.18) !important;

  .jobsimp-track-summary.is-empty .jobsimp-track-summary-mark {

  .jobsimp-track-summary-body {

<template id="jobsimp-pill-tpl">
  <span class="jobsimp-pill untracked">Untracked</span>
</template>

<template id="jobsimp-summary-tpl">
  <div class="jobsimp-track-summary" role="status" aria-live="polite">
    <span class="jobsimp-track-summary-mark" aria-hidden="true"></span>
    <span class="jobsimp-track-summary-body"></span>
  </div>
</template>

<template id="jobsimp-compose-track-tpl">
  <button type="button" class="jobsimp-compose-track T-I J-J5-Ji" tabindex="1" data-jobsimp-compose-track="on">
    <img alt="" draggable="false" />
  </button>
</template>
