<div class="panel" id="tracker">
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <button class="primary" id="addJob">+ Add Job</button>
    <input type="search" id="q" name="q" placeholder="Search…" aria-label="Search jobs">
    <select id="fStatus" name="fStatus" aria-label="Filter by status"><option value="">All statuses</option></select>
  </div>
  <table>
    <thead><tr>
      <th>Date</th><th>Company</th><th>Role</th><th>Type</th><th>Status</th>
      <th>Sponsor</th><th>E-Verify</th><th>Location</th><th>Salary</th>
      <th>Follow-up</th><th>Referral</th><th>Actions</th>
    </tr></thead>
    <tbody id="jobRows"></tbody>
  </table>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h2 id="modalTitle" style="font-size:16px;margin-bottom:14px;color:inherit">Add Job</h2>
    <div class="grid2">
      <div class="field"><label for="m_company">Company *</label><input id="m_company"></div>
      <div class="field"><label for="m_role">Role *</label><input id="m_role"></div>
      <div class="field"><label for="m_type">Type</label><select id="m_type"></select></div>
      <div class="field"><label for="m_date">Date applied</label><input type="date" id="m_date"></div>
      <div class="field"><label for="m_datePosted">Date posted</label><input type="date" id="m_datePosted"></div>
      <div class="field"><label for="m_status">Status</label><select id="m_status"></select></div>
      <div class="field"><label for="m_sponsorship">Sponsorship</label><select id="m_sponsorship"></select></div>
      <div class="field"><label for="m_everify">E-Verify</label><select id="m_everify"></select></div>
      <div class="field"><label for="m_followup">Follow-up date</label><input type="date" id="m_followup"></div>
      <div class="field"><label for="m_referral">Referral</label><select id="m_referral"></select></div>
      <div class="field"><label for="m_location">Location</label><input id="m_location"></div>
      <div class="field"><label for="m_salary">Salary</label><input id="m_salary"></div>
    </div>
    <div class="field"><label for="m_url">URL</label><input id="m_url"></div>
    <div class="field"><label for="m_jd">JD text (powers AI drafting)</label><textarea id="m_jd" rows="4"></textarea></div>
    <div class="field"><label for="m_notes">Notes</label><textarea id="m_notes" rows="2"></textarea></div>
    <div class="err" id="m_err"></div>
    <div class="actions">
      <button id="cancelBtn">Cancel</button>
      <button class="primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>
