<div class="panel" id="profile">
  <div class="card">
    <div class="user-identity">
      <img id="pf_picture" alt="" hidden>
      <div>
        <div class="name" id="pf_name">—</div>
        <div class="email" id="pf_email">—</div>
      </div>
    </div>
    <p class="hint">Google identity is read-only. Contact and work-auth fields below are stored in IndexedDB.</p>
  </div>

  <div class="card">
    <h2>Contact</h2>
    <div class="grid2">
      <div class="field"><label>Phone</label><input id="pf_phone"></div>
      <div class="field"><label>Address</label><input id="pf_address"></div>
      <div class="field"><label>LinkedIn</label><input id="pf_linkedin" placeholder="https://linkedin.com/in/…"></div>
      <div class="field"><label>GitHub</label><input id="pf_github" placeholder="https://github.com/…"></div>
      <div class="field"><label>Portfolio</label><input id="pf_portfolio"></div>
    </div>
  </div>

  <div class="card">
    <h2>Work authorization &amp; preferences</h2>
    <div class="grid2">
      <div class="field"><label>Authorized to work in US?</label><input id="pf_workAuth" placeholder="Yes"></div>
      <div class="field"><label>Require sponsorship?</label><input id="pf_needsSponsorship" placeholder="Yes (F-1 OPT)"></div>
      <div class="field"><label>Salary expectation</label><input id="pf_salaryExpectation"></div>
      <div class="field"><label>Relocation</label><input id="pf_relocation"></div>
      <div class="field"><label>Ethnicity</label><input id="pf_ethnicity"></div>
      <div class="field"><label>Veteran status</label><input id="pf_veteranStatus"></div>
      <div class="field"><label>Disability status</label><input id="pf_disabilityStatus"></div>
    </div>
  </div>

  <div class="actions" style="justify-content:flex-start">
    <button class="primary" id="profileSave">Save profile</button>
    <span id="profileSaveMsg"></span>
  </div>
</div>
