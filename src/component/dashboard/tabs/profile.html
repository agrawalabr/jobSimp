<div class="panel" id="profile">
  <div class="card">
    <div class="user-identity">
      <img id="pf_picture" alt="" hidden>
      <div>
        <div class="name" id="pf_name">—</div>
        <div class="email" id="pf_email">—</div>
      </div>
    </div>
    <p class="hint">Google identity is read-only. Contact and work-auth fields below are stored in IndexedDB.</p>
  </div>

  <div class="card">
    <h2>Contact</h2>
    <div class="grid2">
      <div class="field"><label for="pf_phone">Phone</label><input id="pf_phone"></div>
      <div class="field"><label for="pf_address">Address</label><input id="pf_address"></div>
      <div class="field"><label for="pf_linkedin">LinkedIn</label><input id="pf_linkedin" placeholder="https://linkedin.com/in/…"></div>
      <div class="field"><label for="pf_github">GitHub</label><input id="pf_github" placeholder="https://github.com/…"></div>
      <div class="field"><label for="pf_portfolio">Portfolio</label><input id="pf_portfolio"></div>
    </div>
  </div>

  <div class="card">
    <h2>Work authorization &amp; preferences</h2>
    <div class="grid2">
      <div class="field"><label for="pf_workAuth">Authorized to work in US?</label><input id="pf_workAuth" placeholder="Yes"></div>
      <div class="field"><label for="pf_needsSponsorship">Require sponsorship?</label><input id="pf_needsSponsorship" placeholder="Yes (F-1 OPT)"></div>
      <div class="field"><label for="pf_salaryExpectation">Salary expectation</label><input id="pf_salaryExpectation"></div>
      <div class="field"><label for="pf_relocation">Relocation</label><input id="pf_relocation"></div>
      <div class="field"><label for="pf_ethnicity">Ethnicity</label><input id="pf_ethnicity"></div>
      <div class="field"><label for="pf_veteranStatus">Veteran status</label><input id="pf_veteranStatus"></div>
      <div class="field"><label for="pf_disabilityStatus">Disability status</label><input id="pf_disabilityStatus"></div>
    </div>
  </div>

  <div class="actions" style="justify-content:flex-start">
    <button class="primary" id="profileSave">Save profile</button>
    <span id="profileSaveMsg"></span>
  </div>
</div>
