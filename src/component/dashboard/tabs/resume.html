<div class="panel" id="resume">
  <label class="upload-zone" id="dropZone" for="resumeFile">
    <div class="uz-title">Drop PDF / DOCX / TXT or click to upload</div>
    <div class="hint">Files stay in IndexedDB on this device.</div>
    <input type="file" id="resumeFile" name="resumeFile" accept="" multiple>
  </label>

  <div class="alt-row">
    <div class="divider"></div>
    <button type="button" class="ghost-btn" id="pasteBtn">Paste text instead</button>
    <div class="divider"></div>
  </div>

  <div class="paste-box" id="pasteArea">
    <div class="grid2">
      <div class="field"><label for="pasteName">Name</label><input id="pasteName" placeholder="Pasted resume"></div>
    </div>
    <div class="field"><label for="pasteText">Resume text</label><textarea id="pasteText" rows="8" placeholder="Paste full resume text…"></textarea></div>
    <div class="actions" style="justify-content:flex-start"><button class="primary" id="pasteSave">Save pasted resume</button></div>
  </div>

  <div class="err" id="resumeErr"></div>
  <div class="section-label" id="resumeListLabel">Your resumes</div>
  <div class="resume-list" id="resumeList"></div>

  <div class="edit-panel" id="editPanel" style="display:none">
    <h3>Edit parsed data <span id="editResumeName" style="color:var(--muted);font-weight:400"></span></h3>
    <div class="grid2">
      <div class="field"><label for="ed_name">Name</label><input id="ed_name"></div>
      <div class="field"><label for="ed_email">Email</label><input id="ed_email"></div>
      <div class="field"><label for="ed_phone">Phone</label><input id="ed_phone"></div>
      <div class="field"><label for="ed_address">Address</label><input id="ed_address"></div>
      <div class="field"><label for="ed_linkedin">LinkedIn</label><input id="ed_linkedin"></div>
      <div class="field"><label for="ed_github">GitHub</label><input id="ed_github"></div>
      <div class="field"><label for="ed_portfolio">Portfolio</label><input id="ed_portfolio"></div>
    </div>
    <div class="field"><label for="ed_summary">Summary</label><textarea id="ed_summary" rows="3"></textarea></div>
    <div class="field">
      <label for="ed_newSkill">Skills</label>
      <div class="skill-tags" id="ed_skills"></div>
      <div class="add-skill-row">
        <input id="ed_newSkill" name="ed_newSkill" placeholder="Add skill" aria-label="Add skill">
        <button type="button" class="small" id="ed_addSkillBtn">Add</button>
      </div>
    </div>
    <div class="field"><label for="ed_json">Full parsed JSON (advanced)</label><textarea id="ed_json" rows="10" style="font-family:ui-monospace,monospace;font-size:12px"></textarea></div>
    <div class="err" id="ed_err"></div>
    <div class="actions" style="justify-content:flex-start">
      <button class="primary" id="ed_save">Save parsed</button>
      <button type="button" id="ed_cancel">Cancel</button>
      <span id="resumeMsg"></span>
    </div>
  </div>
</div>
